name: MCCodeCampLibraryTestPlugin
version: '${version}'

main: me.simoncrafter.mCCodeCampLibraryTestPlugin.MCCodeCampLibraryTestPlugin
api-version: '1.21.11'
load: POSTWORLD
softdepend: [FastAsyncWorldEdit, WorldEdit]

commands:
  coursedit: {}
  projectileeffects:
    description: Console-only projectile effect diagnostics and fixed live tests.
    usage: /projectileeffects status|live-meteor|live-ray|restore|disarm

permissions:
  mccodecamp.command.edit.worldmarker:
    description: Create, inspect, replace config and remove world markers for testing.
    default: op